name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: |
          cd web
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd web
          npx vite build

      - name: Ensure cordova.variables.gradle exists
        run: |
          if [ ! -f web/android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            mkdir -p web/android/capacitor-cordova-android-plugins/src/main
            cat > web/android/capacitor-cordova-android-plugins/cordova.variables.gradle << 'EOF'
ext {
  cdvMinSdkVersion = 23
  cdvPluginPostBuildExtras = []
  cordovaConfig = [:]
}
EOF
            cat > web/android/capacitor-cordova-android-plugins/build.gradle << 'EOF'
// Cordova plugins placeholder
EOF
          fi

      - name: Copy web assets to Capacitor
        run: |
          cd web
          npx cap copy android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 27.0.12179894
          cmake: 3.27.5
          build-tools: 34.0.0

      - name: Build debug APK
        run: |
          cd web/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace 2>&1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-trade-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        if: success()
        run: |
          cd web/android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace 2>&1

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guide-trade-release-apk
          path: web/android/app/build/outputs/apk/release/app-release-unsigned.apk
