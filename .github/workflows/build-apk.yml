name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install web dependencies
        run: |
          cd web
          npm install --legacy-peer-deps

      - name: Build frontend
        run: |
          cd web
          npx vite build

      - name: Copy web assets to Capacitor
        run: |
          cd web
          npx cap copy android

      - name: Download Android SDK
        uses: android-actions/download-android-sdk@v5
        with:
          api-level: 34
          ndk: 26.3.10985459
          cmake: 3.27.5
          ndk: 27.0.12179894
          build-tools: 34.0.0
          ndk: 27.0.12179894
        id: android-sdk

      - name: Build debug APK
        run: |
          cd web/android
          export ANDROID_HOME=${{ steps.android-sdk.outputs.path }}
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guide-trade-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK (unsigned)
        if: success()
        run: |
          cd web/android
          export ANDROID_HOME=${{ steps.android-sdk.outputs.path }}
          export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace || true

      - name: Upload release APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guide-trade-release-apk
          path: web/android/app/build/outputs/apk/release/app-release-unsigned.apk
