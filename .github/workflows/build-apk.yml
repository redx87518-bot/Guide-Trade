name: APK Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          cd web
          npm install --legacy-peer-deps

      - name: Build web
        run: |
          cd web
          npx vite build

      - name: Ensure cordova.gradle
        run: |
          if [ ! -f web/android/capacitor-cordova-android-plugins/cordova.variables.gradle ]; then
            mkdir -p web/android/capacitor-cordova-android-plugins/src/main
            printf 'ext {\n  cdvMinSdkVersion = 23\n  cdvPluginPostBuildExtras = []\n  cordovaConfig = [:] \n}\n' > web/android/capacitor-cordova-android-plugins/cordova.variables.gradle
            printf '// Cordova plugins placeholder\n' > web/android/capacitor-cordova-android-plugins/build.gradle
          fi

      - name: Cap copy
        run: |
          cd web
          npx cap copy android

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Build debug APK
        run: |
          cd web/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-trade-debug-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release APK
        if: success()
        run: |
          cd web/android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m" --stacktrace

      - name: Upload release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guide-trade-release-apk
          path: web/android/app/build/outputs/apk/release/app-release-unsigned.apk
