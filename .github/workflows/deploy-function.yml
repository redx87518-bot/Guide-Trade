name: Deploy Function

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appwrite CLI
        run: |
          npm install -g appwrite-cli@vlatest

      - name: Configure Appwrite CLI
        run: |
          appwrite-cli client set-endpoint https://nyc.cloud.appwrite.io/v1
          appwrite-cli client set-project ${{ secrets.APPWRITE_PROJECT_ID }}
          appwrite-cli client set-key ${{ secrets.APPWRITE_API_KEY }}

      - name: Install function dependencies
        run: npm install

      - name: Create function
        run: |
          appwrite functions create \
            --function-id guide-trade-api \
            --name guide-trade-api \
            --entrypoint src/main.js \
            --runtime node-22 \
            --scope "any" \
            --database "guide_trade" \
            --path "/" \
            --methods GET POST PUT DELETE PATCH \
            --vcs-repository "Guide-Trade" \
            --vcs-owner "redx87518-bot" \
            --vcs-branch "main" \
            --execute "users()" \
            --execute "public()" \
            --force || true

      - name: Create deployment
        run: |
          appwrite functions create-deployment \
            --function-id guide-trade-api \
            --directory . \
            --activate \
            --build-id auto

      - name: Wait for deployment and verify
        run: |
          sleep 30
          appwrite functions get-deployment --function-id guide-trade-api --deployment-id auto
