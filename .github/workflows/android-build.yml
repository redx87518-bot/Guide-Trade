name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.11.1
          cache-disabled: true
          cache-read-only: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          package: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon -x lint -x test --init-script init-gradle.gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.retry=true -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

      - name: Extract debug APK
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          find app/build/outputs/apk/debug -name "*.apk" | head -1 | xargs -I {} cp {} ${{ github.workspace }}/artifacts/GuideTrade-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GuideTrade-debug
          path: ${{ github.workspace }}/artifacts/GuideTrade-debug.apk
          if-no-files-found: error
